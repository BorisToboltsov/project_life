# Стенд целиком: база, миграции, бэкенд и веб-сервер со статикой фронтенда.
# Настройки — в .env рядом с этим файлом (образец: .env.example).
name: life

x-backend: &backend
  image: ${BACKEND_IMAGE:-ghcr.io/boristoboltsov/project_life-backend}:${IMAGE_TAG:-latest}
  build: ../backend
  environment:
    LIFE_ENVIRONMENT: prod
    LIFE_DATABASE_URL: postgresql+psycopg://life:${POSTGRES_PASSWORD:?}@db:5432/life

services:
  db:
    image: postgres:18
    restart: unless-stopped
    environment:
      POSTGRES_USER: life
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?}
      POSTGRES_DB: life
    volumes:
      - db:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U life -d life"]
      interval: 5s
      timeout: 3s
      retries: 20

  migrate:
    <<: *backend
    command: ["alembic", "upgrade", "head"]
    restart: "no"
    depends_on:
      db:
        condition: service_healthy

  backend:
    <<: *backend
    restart: unless-stopped
    depends_on:
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/health')"]
      interval: 10s
      timeout: 3s
      retries: 6
      start_period: 5s

  web:
    image: ${WEB_IMAGE:-ghcr.io/boristoboltsov/project_life-web}:${IMAGE_TAG:-latest}
    build: ../frontend
    restart: unless-stopped
    environment:
      SITE_ADDRESS: ${SITE_ADDRESS:?}
    ports:
      - "${HTTP_PORT:-80}:80"
      - "${HTTPS_PORT:-443}:443"
      - "${HTTPS_PORT:-443}:443/udp"
    volumes:
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      backend:
        condition: service_healthy

volumes:
  db:
  caddy_data:
  caddy_config:
