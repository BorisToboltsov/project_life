# Окружение разработки: только база. Бэкенд и фронтенд запускаются с хоста (см. Makefile).
name: life-dev

services:
  db:
    image: postgres:18
    environment:
      POSTGRES_USER: life
      POSTGRES_PASSWORD: life
      POSTGRES_DB: life
    ports:
      # 5433, чтобы не спорить с PostgreSQL, установленным на хосте.
      - "127.0.0.1:5433:5432"
    volumes:
      - db:/var/lib/postgresql
    healthcheck:
      # По TCP, а не через сокет: на пустом томе образ создаёт базу на временном сервере,
      # который слушает только сокет и тут же останавливается. Сокету он ответил бы
      # «готов», и make db вернулся бы раньше настоящего сервера.
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U life -d life"]
      interval: 2s
      timeout: 2s
      retries: 30

volumes:
  db:
