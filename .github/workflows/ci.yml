name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

# Каждая задача вызывает ту же цель Makefile, что и локальный `make check`:
# прогон в CI и на машине разработчика не расходятся.
jobs:
  backend:
    name: Бэкенд
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.2.0
        with:
          enable-cache: true
          cache-dependency-glob: backend/uv.lock
      - run: cd backend && uv sync --locked
      - run: make check-backend

  frontend:
    name: Фронтенд
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          package_json_file: frontend/package.json
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml
      - run: cd frontend && pnpm install --frozen-lockfile
      - run: make check-frontend

  contract:
    name: Версия и типы API
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.2.0
        with:
          enable-cache: true
          cache-dependency-glob: backend/uv.lock
      - uses: pnpm/action-setup@v6
        with:
          package_json_file: frontend/package.json
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml
      - run: cd backend && uv sync --locked
      - run: cd frontend && pnpm install --frozen-lockfile
      - run: make check-version check-api-client

  e2e:
    name: Сквозной смоук
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          package_json_file: frontend/package.json
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml
      - run: cd frontend && pnpm install --frozen-lockfile
      - run: cd frontend && pnpm exec playwright install --with-deps chromium
      - run: make e2e
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: playwright-report
          path: frontend/playwright-report
          retention-days: 7

  deploy-check:
    name: Скрипты выкладки
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: make check-deploy

  publish:
    name: Публикация образов
    # Образы выходят только из main и только после всех гейтов. На сервер их ставит
    # администратор командой life-update (docs/adr/0005-deployment.md): публикация сама
    # ничего не обновляет, доступа к серверу у GitHub нет.
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [backend, frontend, contract, e2e, deploy-check]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    env:
      REGISTRY: ghcr.io/boristoboltsov
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v7
      - name: Вход в реестр
        run: echo "$GH_TOKEN" | docker login ghcr.io --username "$GITHUB_ACTOR" --password-stdin
      - name: Сборка и публикация
        run: |
          version="$(sed -n 's/^version = "\(.*\)"/\1/p' backend/pyproject.toml | head -n 1)"
          # latest — то, что ставит сервер; тег с версией и коммитом — для отката.
          tag="$version-${GITHUB_SHA::7}"
          for part in backend web; do
            context="$([ "$part" = web ] && echo frontend || echo backend)"
            image="$REGISTRY/project_life-$part"
            docker build \
              --label "org.opencontainers.image.source=https://github.com/$GITHUB_REPOSITORY" \
              --label "org.opencontainers.image.revision=$GITHUB_SHA" \
              --label "org.opencontainers.image.version=$version" \
              --tag "$image:$tag" --tag "$image:latest" "$context"
            docker push --all-tags "$image"
          done
